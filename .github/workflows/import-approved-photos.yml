name: Import approved Lazarus photos

on:
  push:
    branches: [main]
    paths:
      - Lazarus_index_dan_foto_terbaru.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lazarus-approved-photo-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify package and publish website files atomically
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: AzrielChoerulHakim/Lazarus_Ethereal_Scent
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile

          REPO = os.environ['GITHUB_REPOSITORY']
          if REPO != os.environ['EXPECTED_REPOSITORY']:
              raise RuntimeError('This importer is restricted to the Lazarus repository.')
          BASE = os.environ['GITHUB_SHA']
          PACKAGE = 'Lazarus_index_dan_foto_terbaru.zip'
          PACKAGE_SHA256 = '3dcd01b52125bc3eec389025681fcedb22d6161f4aaf0fb52eeea3f216f26da5'
          ORIGINAL_INDEX = '7722d8838cb0ba7ee8cabc9ddec9e56b884058c9'
          APPROVED_INDEX = '2c0ecf49c98227a26cf8a639eb78fac82d12f8ed'
          SLUGS = (
              'artic-wave', 'golden-eclipse', 'tropical-blaze',
              'spring-petals', 'golden-charm', 'rouge-vanilla',
              'timeless-v', 'midnight-illusion', 'radiant-blossom',
          )
          WEBSITE_FILES = {'index.html'} | {
              f'assets/products/{slug}{suffix}'
              for slug in SLUGS
              for suffix in ('.jpg', '.webp', '-600.webp')
          }
          EXPECTED_MEMBERS = WEBSITE_FILES | {'README-UPDATE.txt'}
          API = f'https://api.github.com/repos/{REPO}'
          HEADERS = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'User-Agent': 'lazarus-approved-photo-import',
          }

          def api(path, payload=None, method=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  API + path, data=data, headers=HEADERS,
                  method=method or ('GET' if data is None else 'POST'),
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', 'replace')[:1200]
                  raise RuntimeError(f'GitHub API {error.code} at {path}: {detail}') from None

          def blob_sha(data):
              header = f'blob {len(data)}\0'.encode('ascii')
              return hashlib.sha1(header + data).hexdigest()

          def read_tree(sha):
              result = api(f'/git/trees/{sha}?recursive=1')
              if result.get('truncated'):
                  raise RuntimeError('Tree listing incomplete; refusing to overwrite files.')
              return {item['path']: item for item in result['tree'] if item['type'] != 'tree'}

          head = api('/git/ref/heads/main')['object']['sha']
          if head != BASE:
              raise RuntimeError('main has changed. Run this workflow again from the Actions tab.')
          commit = api(f'/git/commits/{BASE}')
          before = read_tree(commit['tree']['sha'])
          if PACKAGE not in before:
              raise RuntimeError('Upload the approved ZIP to the repository root, then retry.')
          if before.get('index.html', {}).get('sha') not in (ORIGINAL_INDEX, APPROVED_INDEX):
              raise RuntimeError('index.html has newer edits. Reconcile them before importing.')
          if before[PACKAGE].get('size', 0) > 10_000_000:
              raise RuntimeError('Unexpected package size.')
          packed = api('/git/blobs/' + before[PACKAGE]['sha'])
          if packed.get('encoding') != 'base64':
              raise RuntimeError('Unexpected GitHub blob encoding.')
          archive_bytes = base64.b64decode(packed['content'])
          if hashlib.sha256(archive_bytes).hexdigest() != PACKAGE_SHA256:
              raise RuntimeError('ZIP checksum does not match the approved package. No website files changed.')
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              entries = archive.infolist()
              if len(entries) != len(EXPECTED_MEMBERS) or set(archive.namelist()) != EXPECTED_MEMBERS:
                  raise RuntimeError('Unexpected or duplicate ZIP entries. No files changed.')
              if sum(entry.file_size for entry in entries) > 32_000_000:
                  raise RuntimeError('Unpacked package exceeds the permitted size.')
              files = {name: archive.read(name) for name in WEBSITE_FILES}
          if blob_sha(files['index.html']) != APPROVED_INDEX:
              raise RuntimeError('index.html does not match the approved version.')
          if b'data:image/jpeg;base64,' in files['index.html']:
              raise RuntimeError('Embedded JPEG data found; expected separate product assets.')

          # Upload immutable objects first. main remains unchanged until every file verifies.
          updates = []
          expected_shas = {}
          for name in sorted(files):
              data = files[name]
              expected_sha = blob_sha(data)
              expected_shas[name] = expected_sha
              if before.get(name, {}).get('sha') == expected_sha:
                  sha = expected_sha
              else:
                  sha = api('/git/blobs', {
                      'content': base64.b64encode(data).decode('ascii'),
                      'encoding': 'base64',
                  })['sha']
              if sha != expected_sha:
                  raise RuntimeError(f'Upload checksum mismatch: {name}')
              updates.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              print(f'Verified {name} ({len(data)} bytes)', flush=True)

          # Remove only the temporary import ZIP; keep logo and all unrelated repository files.
          updates.append({'path': PACKAGE, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree_sha = api('/git/trees', {
              'base_tree': commit['tree']['sha'], 'tree': updates,
          })['sha']
          after = read_tree(tree_sha)
          if set(after) != (set(before) - {PACKAGE}) | WEBSITE_FILES:
              raise RuntimeError('Unexpected tree changes; main was not updated.')
          for name, item in before.items():
              if name != PACKAGE and name not in WEBSITE_FILES:
                  if after[name]['sha'] != item['sha'] or after[name]['mode'] != item['mode']:
                      raise RuntimeError(f'Unrelated file changed: {name}')
          for name, expected_sha in expected_shas.items():
              if after[name]['sha'] != expected_sha:
                  raise RuntimeError(f'Tree verification failed: {name}')

          new_commit = api('/git/commits', {
              'message': 'feat: publish nine approved product photos and lightweight motion',
              'tree': tree_sha,
              'parents': [BASE],
              'author': {
                  'name': 'github-actions[bot]',
                  'email': '41898282+github-actions[bot]@users.noreply.github.com',
              },
          })['sha']
          # Fast-forward only: concurrent edits cause a safe failure instead of being overwritten.
          api('/git/refs/heads/main', {'sha': new_commit, 'force': False}, method='PATCH')
          url = f'https://github.com/{REPO}/commit/{new_commit}'
          summary = (
              '## Approved Lazarus photos imported\n\n'
              f'Installed **{len(WEBSITE_FILES)} website files**: index.html and 27 image assets '
              '(nine original JPGs, nine WebPs, nine mobile WebPs).\n\n'
              'Original packaging photos preserved; logo and unrelated files unchanged. '
              'The temporary ZIP was removed.\n\n'
              f'[Inspect the website update commit]({url})\n\n'
              'Repository update verified. Live hosting/deployment is a separate step.\n'
          )
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
