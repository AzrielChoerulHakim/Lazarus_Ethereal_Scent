name: Fix Lazarus Pages
on:
  push:
    paths:
      - '.github/workflows/fix-pages.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix index.html
        run: |
          sed -i 's/export default function App()/function App()/' index.html
          sed -i 's#src="/assets/logo.png"#src="assets/logo.png"#g' index.html
          sed -i 's#image: "/assets/fragrances/#image: "assets/fragrances/#g' index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix GitHub Pages rendering" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-pages.yml
          git add .github/workflows/fix-pages.yml
          git commit -m "Remove temporary Pages fixer"
          git push
